name: PR Checks

# What a PR must pass besides `test` (test.yml) and `PR Title` (pr-title.yml):
# the linter, and the image it would ship, built, linted, scanned and run.
# Decision records 0030 and 0038.
#
# Branch protection requires `Lint` and `Docker Build / Docker Build` (this
# job's name, then the module's); renaming either strands PRs on a check that
# never reports.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Pinned here, where Dependabot doesn't look; the same version as
      # Bluebird's and the Makefile's `lint` target. Move all three together.
      - run: pip install ruff==0.16.0
      - run: ruff check .

  # yggdrasil's docker-build module: hadolint, the linux/amd64 image built but
  # not pushed, a Trivy table in a sticky comment, the smoke test, then a
  # failure on any fixable Critical or High, as the release would refuse.
  docker-build:
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@d8443185af7a5e3b4b197b8ee167533d79c816c5 # v0.14.0
    permissions:
      contents: read
      pull-requests: write # the sticky scan comment
    with:
      # As the release passes it: the apt upgrade layer reruns per push.
      build-args: APP_COMMIT=${{ github.event.pull_request.head.sha }}
      # What only a built image shows: the entry point starts, the dependencies
      # load on the image's own Python (a new Python minor can ship before a
      # wheel for it does), the zoneinfo data is there for TZ, and it runs as
      # the unprivileged user the manifests expect.
      smoke-test: |
        docker run --rm "$IMAGE" --help
        docker run --rm --entrypoint python3 "$IMAGE" -c 'import psycopg, zoneinfo; zoneinfo.ZoneInfo("America/Los_Angeles")'
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 1000
