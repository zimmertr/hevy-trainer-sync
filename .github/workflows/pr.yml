name: PR Checks

# What a PR must pass besides `test` (test.yml) and `PR Title` (pr-title.yml):
# the linter, and the image it would ship, built, linted, scanned and run.
# Bluebird's pr.yml, cut to this repo. Decision record 0030.
#
# Branch protection requires the job names `Lint` and `Docker Build`; renaming
# either strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Pinned here, where Dependabot doesn't look; the same version as
      # Bluebird's and the Makefile's `lint` target. Move all three together.
      - run: pip install ruff==0.16.0
      - run: ruff check .

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write  # the sticky scan comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The platform the release ships. Loaded into the runner's daemon so
      # Trivy can scan it and the smoke test can run it; nothing is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hevy-trainer-sync:pr-scan
          # As the release passes it: the apt upgrade layer reruns per push.
          build-args: APP_COMMIT=${{ github.event.pull_request.head.sha }}

      # The release scan's rules, so a PR sees what the release would refuse
      # before it merges: fixable only, the shared trivy.yaml, and a failure
      # on any Critical or High. JSON once; the table and comment derive from it.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hevy-trainer-sync:pr-scan
          format: json
          output: trivy.json
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - name: Render scan report
        id: report
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `?` on both levels: a report with no results is the clean case.
          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          CRIT_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy.json)
          echo "crit_high=${CRIT_HIGH}" >> "$GITHUB_OUTPUT"
          {
            echo "<!-- hevy-trainer-sync-image-scan -->"
            echo "### Image vulnerability scan"
            echo ""
            echo "Trivy scan of this PR's image at \`${PR_SHA}\` (linux/amd64, fixable vulnerabilities only)."
            echo ""
            if [ "$TOTAL" -eq 0 ]; then
              echo "No fixable vulnerabilities."
            else
              echo "**${TOTAL} fixable vulnerabilities, ${CRIT_HIGH} of them Critical or High.** Critical and High fail this check, and the release would refuse them too."
              echo ""
              echo "<details><summary>Full report</summary>"
              echo ""
              echo '```text'
              trivy convert --format table trivy.json
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "_Rewritten on every push. Unfixed OS CVEs are left out._"
          } > scan-comment.md
          cat scan-comment.md >> "$GITHUB_STEP_SUMMARY"

      # Found by its hidden marker, so it is edited in place on every push.
      # Skipped for Dependabot: its pull_request runs get a read-only token, so
      # the step summary above is its only surface.
      - name: Comment the scan result (sticky)
        if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          CID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- hevy-trainer-sync-image-scan -->")) | .id' | head -n1)
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" -F body=@scan-comment.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@scan-comment.md >/dev/null
          fi

      # What only a built image can show: the entry point starts, the
      # dependencies load on the image's own Python (a new Python minor can
      # ship before a wheel for it does), the zoneinfo data is there for TZ,
      # and the process runs as the unprivileged user the manifests expect.
      - name: Smoke test the built image
        run: |
          fail=0
          check() {  # label, actual, expected
            if [ "$2" = "$3" ]; then echo "  ok    $1"; else echo "  FAIL  $1 (want '$3', got '$2')"; fail=1; fi
          }
          check "the entry point answers --help" \
            "$(docker run --rm hevy-trainer-sync:pr-scan --help | head -n1 | cut -d' ' -f1-2)" "usage: hevy-trainer-sync"
          check "psycopg loads on the image's Python" \
            "$(docker run --rm --entrypoint python3 hevy-trainer-sync:pr-scan -c 'import psycopg; print(psycopg.pq.version() > 0)')" "True"
          check "the zoneinfo data is installed" \
            "$(docker run --rm --entrypoint python3 hevy-trainer-sync:pr-scan -c 'import zoneinfo; print(zoneinfo.ZoneInfo("America/Los_Angeles").key)')" "America/Los_Angeles"
          check "it runs as UID 1000" \
            "$(docker run --rm --entrypoint id hevy-trainer-sync:pr-scan -u)" "1000"
          exit "$fail"

      - name: Fail on fixable Critical or High vulnerabilities
        env:
          CRIT_HIGH: ${{ steps.report.outputs.crit_high }}
        run: |
          if [ "$CRIT_HIGH" -gt 0 ]; then
            echo "::error::${CRIT_HIGH} fixable Critical/High vulnerabilities in this PR's image. The release would refuse it. See the scan comment."
            exit 1
          fi
