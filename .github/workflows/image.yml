name: image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m coverage run -m unittest discover -s tests -v
      # Fails the job below 100% line and branch coverage (fail_under in .coveragerc).
      - run: python -m coverage report

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The commit is the tag, so kubernetes-manifests can pin the exact
          # build it runs.
          tags: |
            zimmertr/hevy-trainer-sync:${{ github.sha }}
            zimmertr/hevy-trainer-sync:latest

  # Bump the pinned tag in Kubernetes-Manifests so Argo CD rolls the new build
  # out. Same shape as bluebird's release workflow: a fixed branch force-pushed
  # fresh off main each time, one self-merging PR, so rapid merges collapse into
  # a single up-to-date PR instead of a pile. GH_PAT needs contents and
  # pull-requests write on zimmertr/Kubernetes-Manifests.
  update-manifests:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the image bump PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SHA: ${{ github.sha }}
          APP_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BR="chore/hevy-trainer-sync-image"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/zimmertr/Kubernetes-Manifests.git" k8s-manifests
          cd k8s-manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR" origin/main
          # Edit the one newTag line in place. `kustomize edit set image` rewrites
          # the whole file and strands the comments, so it is not used here.
          python3 - "$SHA" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("misc/hevy2garmin/kustomization.yml")
          s = p.read_text()
          s, n = re.subn(
              r"(name: zimmertr/hevy-trainer-sync\n(?:[ \t]+(?:#.*|newName:.*)\n)*[ \t]+newTag: )[0-9a-f]+",
              lambda m: m.group(1) + sys.argv[1], s)
          assert n == 1, f"expected one hevy-trainer-sync newTag line, matched {n}"
          p.write_text(s)
          PY
          if git diff --quiet; then
            echo "Manifests already at ${SHA}; nothing to bump."
            exit 0
          fi
          SHORT="${SHA:0:7}"
          git commit -am "chore(hevy2garmin): bump hevy-trainer-sync to ${SHORT}"
          git push -f origin "$BR"

          TITLE="chore(hevy2garmin): bump hevy-trainer-sync to ${SHORT}"
          BODY="Automated by hevy-trainer-sync CI. Pins \`zimmertr/hevy-trainer-sync:${SHA}\`.

          - Commit: ${SERVER_URL}/${APP_REPO}/commit/${SHA}"
          PR_NUM="$(gh pr list --head "$BR" --state open --json number -q '.[0].number')"
          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BR" --title "$TITLE" --body "$BODY"
          fi
          # Auto-merge is disarmed by every force-push, so re-arm each time. The
          # fallback covers checks that are already green, where --auto is refused.
          gh pr merge --auto --squash "$BR" || gh pr merge --squash "$BR"
