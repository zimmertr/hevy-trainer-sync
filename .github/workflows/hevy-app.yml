name: Hevy App Check

# Trainer's weight, rep and week rules and the exercise library come from
# Hevy's Android app (trainer_rules.py, library.py), so an app update can
# change them without a word. Every week this downloads the latest app,
# decompiles it, and compares what hevy-trainer-sync follows with what the repo
# holds (scripts/hevy_app.py). A change opens an issue; anything else that goes
# wrong fails the run, which GitHub emails. Decision record 0042.
#
# The app comes from APKPure, which apkeep's authors warn has served altered
# apps, hence `acknowledge_dangers`. It is only unzipped and decompiled here,
# never installed or run, and the job holds no secret but its own token.
on:
  schedule:
    - cron: '41 15 * * 1' # Mondays 15:41 UTC, off the top of the hour, when GitHub sheds cron load
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Hevy App Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # the issue that reports a change
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r scripts/requirements-hevy-app.txt
      - name: Download the app
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          docker run --rm -v "$RUNNER_TEMP/apk:/output" \
            ghcr.io/efforg/apkeep:stable@sha256:f3ea98f06a010419503a9c4176b337bc72f4322acf59cc4e4ebcbfd24f9ca01a \
            -d apk-pure -o acknowledge_dangers=true -a com.hevy /output
      - name: Compare
        id: compare
        run: |
          set +e
          python scripts/hevy_app.py check "$RUNNER_TEMP/apk/com.hevy.xapk" > "$RUNNER_TEMP/report.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 3 is a change, reported below; anything else but 0 is a failure.
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
      - name: Open an issue
        if: steps.compare.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hevy's app changed something hevy-trainer-sync follows"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq length)
          if [ "$open" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/report.md" \
              --label P1 --label bug --label hevy
          fi
