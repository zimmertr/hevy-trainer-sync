name: release

# Every merge to main cuts a release through yggdrasil's release module.
# GitVersion reads the bump from the squash commit's title, the image is
# pushed under that version and scanned, the commit is tagged and released,
# then a self-merging Kubernetes-Manifests PR points the CronJob at it.
# Decision records 0021, 0022 and 0038.
on:
  push:
    branches: [main]

# One release at a time, so two quick merges cannot race on the manifest bump.
# cancel-in-progress stays false so every merge still releases, in order.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # The squash commit, tested as merged before anything is built from it.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: test
    uses: zimmertr/yggdrasil/.github/workflows/release.yml@4e5afc95d7f3ba6c99d18e245fd3cf726c72fb63 # v0.8.1
    permissions:
      contents: write # the tag and release
    with:
      # linux/amd64 only: the cluster is amd64.
      images: '[{"image": "zimmertr/hevy-trainer-sync"}]'
      # The fixed branch and title keep one open bump PR across releases.
      deploys: >-
        [{"repo": "zimmertr/Kubernetes-Manifests",
          "file": "misc/hevy2garmin/kustomization.yml",
          "set": "(.images[] | select(.name == \"zimmertr/hevy-trainer-sync\")).newTag",
          "branch": "chore/hevy-trainer-sync-image",
          "title": "chore(hevy2garmin): bump hevy-trainer-sync"}]
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Contents and pull-requests write on Kubernetes-Manifests.
      deploy-token: ${{ secrets.GH_PAT }}
