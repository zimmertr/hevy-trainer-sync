name: Scheduled Image Scan

# The release scan gates what reaches production, but CVEs are published after
# an image ships. This re-scans the latest released image every week, sends the
# findings to the Security tab, and fails (and GitHub emails) only on a fixable
# Critical or High. yggdrasil's image-scan module. Decision records 0026 and
# 0038.
on:
  schedule:
    - cron: '17 14 * * 1' # Mondays 14:17 UTC, off the top of the hour, when GitHub sheds cron load
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scheduled Image Scan
    uses: zimmertr/yggdrasil/.github/workflows/image-scan.yml@95c4f710c3600dba170ed579c0beabab507011b9 # v0.9.2
    permissions:
      contents: read
      security-events: write # the SARIF upload
    with:
      # The category keeps the Security tab's alert history.
      images: '[{"image": "zimmertr/hevy-trainer-sync", "category": "trivy-released-image"}]'
