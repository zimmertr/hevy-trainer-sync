version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  # Dependabot reads the comment, proposes the next release, and rewrites the
  # SHA and the comment together, so a pin moves only by PR. Decision record 0023.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `build(deps): Bump ...`, a title the PR Title check and GitVersion read
    # as a patch.
    commit-message:
      prefix: build
      include: scope
