# Bluebird's rule set (its backend/ruff.toml), minus the FastAPI-specific import
# ban. Ruff's defaults are E4, E7, E9 and F only: no import sorting, no bugbear,
# no pyupgrade. BLE is the blind `except Exception`; a broad catch that stays
# says why on its line, as `# noqa: BLE001 reason`. Record 0030.
target-version = "py313"
line-length = 120

[lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
